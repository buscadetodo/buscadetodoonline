server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Caché del navegador.
    # Ojo: un add_header dentro de un location anula los del server, así que
    # cada location repite los headers de seguridad.

    # /static/: JS, CSS y medios del build, con un código en el nombre que
    # cambia en cada deploy. Se pueden guardar un año sin volver a preguntar.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Service worker (instalar como app): el navegador tiene que preguntar
    # siempre si hay uno nuevo; si no, nadie recibiría las actualizaciones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Íconos, logos y manifest: no cambian de nombre al actualizarlos, así
    # que se guardan solo un día (antes era un año y el favicon viejo quedaba).
    location ~* \.(png|ico|svg|json|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Manejo de rutas de SPA (Single Page Application). index.html se
    # revalida en cada visita para que cada deploy se vea enseguida.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Seguridad: ocultar versión de Nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Manejo de errores
    error_page 404 /index.html;
}
